name: E2E Pipeline (Playwright)

on:
  workflow_dispatch: # Permite disparo manual desde la UI de GitHub
  schedule:
    - cron: '0 3 * * *' # Corre todos los días a las 3:00 AM UTC

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sparnarok_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./Frontend
        run: npm run build

      - name: Restore Backend Dependencies
        working-directory: ./Backend
        run: dotnet restore

      - name: Build Backend
        working-directory: ./Backend
        run: dotnet build --no-restore --configuration Release

      # Paso crucial: Instalar binarios de navegadores para Playwright.
      # Usamos el script generado por el paquete en la carpeta bin/Debug (o bin/Release).
      - name: Install Playwright Browsers
        working-directory: ./Backend/Sparnarok.Tests.E2E
        run: |
          dotnet build
          pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps

      # Se levanta la API en segundo plano con el & al final
      - name: Start Backend API
        working-directory: ./Backend/Sparnarok.Api
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=sparnarok_db;Username=postgres;Password=password
        run: dotnet run --configuration Release &

      # Se levanta el frontend en segundo plano. En Vite, "npm run preview" sirve el dist de producción.
      - name: Start Frontend Preview
        working-directory: ./Frontend
        run: npm run preview &
        
      # Asegurar que los servicios estén arriba antes de correr los tests (wait-on)
      # Nota: Cambiar "5000" por el puerto real de ASP.NET (puede ser 5000 o 5195)
      - name: Wait for services
        run: npx wait-on http://localhost:5173 http://localhost:5000/health -t 30000

      - name: Run E2E Tests
        working-directory: ./Backend
        run: dotnet test Sparnarok.Tests.E2E/Sparnarok.Tests.E2E.csproj --configuration Release --logger trx
